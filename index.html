<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRB Monopoly — Nowa plansza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#171613; --paper:#f6efe0; --paper2:#efe3ca; --green:#173e32; --green2:#0e2c24;
  --gold:#d0a84c; --line:#b8a889; --muted:#6d6558;
  --brown:#86542f; --sky:#73bddd; --pink:#d66b98; --orange:#e58b43;
  --red:#bd4b45; --yellow:#e4c245; --forest:#4f8b5b; --navy:#355b94;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#100f0c;color:var(--ink);font-family:'DM Sans',sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:36px;background:
 radial-gradient(circle at 50% 8%,#2c2921 0,#14130f 42%,#090908 100%)}
.stage{width:min(94vw,1040px);display:flex;justify-content:center;align-items:center}
.board-shell{width:960px;aspect-ratio:1;border-radius:18px;padding:16px;background:linear-gradient(145deg,#e1c575,#8b6a29 44%,#f0d487 100%);box-shadow:0 40px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.12) inset}
.board{width:100%;height:100%;display:grid;grid-template-columns:112px repeat(9,1fr) 112px;grid-template-rows:112px repeat(9,1fr) 112px;position:relative;overflow:hidden;border:6px solid #241d13;background:var(--paper);box-shadow:inset 0 0 0 2px rgba(255,255,255,.45)}
.board:before{content:"";position:absolute;left:112px;right:112px;top:112px;bottom:112px;background:linear-gradient(145deg,#1a4a3b,#0d2d25);z-index:0}
.center{position:absolute;left:112px;right:112px;top:112px;bottom:112px;display:flex;align-items:center;justify-content:center;z-index:0}
.center-card{width:72%;height:64%;border:2px solid rgba(208,168,76,.62);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform:rotate(-5deg);position:relative;background:radial-gradient(circle at center,rgba(255,255,255,.05),transparent 70%);box-shadow:0 0 0 14px rgba(208,168,76,.04),inset 0 0 40px rgba(0,0,0,.08)}
.center-card:before,.center-card:after{content:"✦";position:absolute;color:rgba(208,168,76,.55);font-size:22px}.center-card:before{top:16px;left:20px}.center-card:after{bottom:16px;right:20px}
.brand-small{font-size:13px;letter-spacing:5px;text-transform:uppercase;color:#d9c98d;font-weight:700;margin-bottom:8px}
.brand{font-family:Anton,sans-serif;letter-spacing:3px;font-size:72px;line-height:.88;color:#efe0a5;text-shadow:0 5px 0 rgba(0,0,0,.2)}
.brand-sub{margin-top:15px;font-size:11px;letter-spacing:4px;color:#b9d0c5;text-transform:uppercase}
.space{position:relative;z-index:2;border:1px solid var(--line);background:var(--paper);display:flex;overflow:hidden}
.side-bottom{flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:7px}.side-top{flex-direction:column-reverse;align-items:center;justify-content:flex-end;padding-bottom:7px}.side-left{flex-direction:row-reverse;align-items:center;justify-content:flex-end;padding-right:7px}.side-right{flex-direction:row;align-items:center;justify-content:flex-end;padding-left:7px}
.property-color{flex:none;box-shadow:inset 0 -2px 5px rgba(0,0,0,.16)}
.side-bottom .property-color,.side-top .property-color{width:100%;height:26px}.side-left .property-color,.side-right .property-color{height:100%;width:26px}
.text-wrap{flex:1;width:100%;display:flex;justify-content:center;align-items:center;padding:6px;min-width:0}.label{font-weight:800;font-size:9.5px;letter-spacing:.45px;text-transform:uppercase;line-height:1.1;text-align:center;word-break:break-word}.price{font-size:8px;font-weight:600;color:var(--muted);margin-top:3px}
.side-left .label,.side-right .label{white-space:nowrap}.side-left .text-wrap{transform:rotate(90deg)}.side-right .text-wrap{transform:rotate(-90deg)}
.corner{background:linear-gradient(145deg,#fbf5e8,#eadfc7);display:flex;align-items:center;justify-content:center;text-align:center;padding:8px}.corner .corner-inner{font-family:Anton,sans-serif;letter-spacing:1px;font-size:18px;line-height:1.05}.corner small{display:block;font:700 9px 'DM Sans',sans-serif;letter-spacing:1.5px;color:#6e6658;margin-top:5px}
.start .corner-inner{color:#194f3d}.jail .corner-inner{color:#27231d}.parking .corner-inner{color:#314764}.gojail .corner-inner{color:#8f3f3b}
.event .text-wrap:before{content:"?";display:block;font-family:Anton,sans-serif;font-size:22px;line-height:1;color:#b18a39;margin-bottom:2px;text-align:center}.tax .text-wrap:before{content:"₿";display:block;font-family:Anton,sans-serif;font-size:20px;line-height:1;color:#6e5a34;margin-bottom:2px;text-align:center}.utility .text-wrap:before{content:"◈";display:block;font-size:18px;line-height:1;color:#356c64;margin-bottom:2px;text-align:center}.shop{background:linear-gradient(145deg,#00589d,#063d71);color:#ffd935}.shop .text-wrap:before{content:"▦";display:block;font-size:18px;line-height:1;color:#ffd935;margin-bottom:2px;text-align:center}
.brown .property-color{background:var(--brown)}.sky .property-color{background:var(--sky)}.pink .property-color{background:var(--pink)}.orange .property-color{background:var(--orange)}.red .property-color{background:var(--red)}.yellow .property-color{background:var(--yellow)}.forest .property-color{background:var(--forest)}.navy .property-color{background:var(--navy)}
.token{position:absolute;z-index:9;width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 9px rgba(0,0,0,.5),inset 0 2px 3px rgba(255,255,255,.5)}
@media(max-width:900px){.board-shell{width:92vw;padding:10px}.board{grid-template-columns:10.5% repeat(9,1fr) 10.5%;grid-template-rows:10.5% repeat(9,1fr) 10.5%}.board:before{left:10.5%;right:10.5%;top:10.5%;bottom:10.5%}.center{left:10.5%;right:10.5%;top:10.5%;bottom:10.5%}.brand{font-size:clamp(38px,8vw,72px)}.label{font-size:clamp(6px,1.15vw,9.5px)}.corner .corner-inner{font-size:clamp(9px,2vw,18px)}}
</style>
</head>
<body>
<div class="stage">
  <div class="board-shell">
    <div class="board" id="board">
      <div class="center"><div class="center-card"><div class="brand-small">GRB ORIGINAL</div><div class="brand">MONOPOLY</div><div class="brand-sub">handel • ryzyko • zwycięstwo</div></div></div>
    </div>
  </div>
</div>
<script>
const spaces=[
 ['START','corner start'],['Dom Pesta','property brown'],['Kasa Społ.','event'],['Dom Natana','property brown'],['Podatek','tax'],['Żabka 1','shop'],['Brenna','property sky'],['Szansa','event'],['Rybarzowice','property sky'],['Przesieka','property sky'],
 ['WIĘZIENIE','corner jail'],['Hotel 1','property pink'],['Elektrownia','utility'],['Hotel 2','property pink'],['mm','property pink'],['Żabka 2','shop'],['Salon','property orange'],['Kasa Społ.','event'],['Sami swoi','property orange'],['Pokój basen.','property orange'],
 ['PARKING','corner parking'],['Dom Anusa','property red'],['Szansa','event'],['Dom Lewego','property red'],['Dom Wacha','property red'],['Żabka 3','shop'],['Borek','property yellow'],['Los Santos','property yellow'],['Wodociągi','utility'],['Plet','property yellow'],
 ['IDŹ DO WIĘZ.','corner gojail'],['Klub Platz','property forest'],['Piątek','property forest'],['Kasa Społ.','event'],['Pewex','property forest'],['Żabka 4','shop'],['Szansa','event'],['82','property navy'],['Podatek Luks.','tax'],['Przystanek','property navy']
];
const board=document.getElementById('board');
function add(i){
 const [name,cls]=spaces[i];const el=document.createElement('div');el.className='space '+cls;
 let row,col,side;
 if(i<11){row=11;col=11-i;side='side-bottom'}else if(i<20){row=11-(i-10);col=1;side='side-left'}else if(i<31){row=1;col=1+(i-20);side='side-top'}else{row=1+(i-30);col=11;side='side-right'}
 el.classList.add(side);el.style.gridRow=row;el.style.gridColumn=col;
 if(cls.includes('corner')) el.innerHTML=`<div class="corner-inner">${name}<small>${i===0?'ZBIERZ GOTÓWKĘ':i===10?'ODPOCZNIJ':i===20?'CHWILA SPOKOJU':'KARA'}</small></div>`;
 else el.innerHTML=`${cls.includes('property')?'<div class="property-color"></div>':''}<div class="text-wrap"><div><div class="label">${name}</div>${cls.includes('property')?'<div class="price">WŁASNOŚĆ</div>':''}</div></div>`;
 board.appendChild(el);
}
spaces.forEach((_,i)=>add(i));
</script>
</body>
</html>
